<!DOCTYPE html>
<html>
<head>
    <title>Meteogram Card Test</title>
    <script type="module" src="./dist/meteogram-card.js"></script>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 20px auto;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            height: 600px;
        }
        .controls {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"] {
            margin-bottom: 10px;
            padding: 5px;
            width: 200px;
        }
        input[type="checkbox"] {
            margin-right: 8px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 16px;
            background-color: #03a9f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1>Meteogram Card Test</h1>

<div class="controls">
    <label for="latitude">Latitude:</label>
    <input type="text" id="latitude" value="58.4314">

    <label for="longitude">Longitude:</label>
    <input type="text" id="longitude" value="8.8255">

    <label for="title">Title:</label>
    <input type="text" id="title" value="Arendal Weather">

    <!-- Height is applied to the container, not passed as config: the card has no
         `height` option and never has, so the old control silently did nothing. -->
    <label for="height">Height (px):</label>
    <input type="number" id="height" value="500">

    <label for="displayMode">Display mode:</label>
    <select id="displayMode">
        <option value="full" selected>full</option>
        <option value="core">core</option>
        <option value="focussed">focussed</option>
    </select>

    <!-- Span matters for the sun strip: 8h can contain no sunrise at all (strip wholly
         light or dark), 24h contains exactly one of each, and max is ~9 days and around
         18 transitions — the case where per-event markers would clutter and a strip
         should still read cleanly. -->
    <label for="hours">Hours:</label>
    <select id="hours">
        <option value="8h">8h</option>
        <option value="12h">12h</option>
        <option value="24h">24h</option>
        <option value="48h" selected>48h</option>
        <option value="72">72h</option>
        <option value="120">120h</option>
        <option value="max">max</option>
    </select>

    <label><input type="checkbox" id="showWind" checked> Wind band</label>
    <label><input type="checkbox" id="showSun" checked> Sun strip</label>
    <label><input type="checkbox" id="showPressure" checked> Pressure</label>
    <label><input type="checkbox" id="showPrecipitation" checked> Precipitation</label>
    <label><input type="checkbox" id="showCloudCover" checked> Cloud cover</label>
    <label><input type="checkbox" id="showWeatherIcons" checked> Weather icons</label>
    <label><input type="checkbox" id="darkMode"> Dark mode</label>
    <!-- `debug`, not `disable_debug` — the old name was never read either. -->
    <label><input type="checkbox" id="debug"> Debug logging</label>

    <button id="updateBtn">Update Meteogram</button>
</div>

<div class="card">
    <meteogram-card id="meteogram"></meteogram-card>
</div>

<script>
    // Wait for custom element to be defined
    customElements.whenDefined('meteogram-card').then(() => {
        const meteogram = document.getElementById('meteogram');
        const updateBtn = document.getElementById('updateBtn');

        // Mock the Home Assistant object that would normally be provided
        // Enough of hass to exercise what the card reads. `locale.time_format` is the
        // 12/24-hour preference; a real Home Assistant always supplies it, and without
        // it the card falls back to whatever the language implies (en => AM/PM).
        meteogram.hass = {
            language: 'en',
            locale: { language: 'en', time_format: '24' }
        };

        const $ = (id) => document.getElementById(id);
        const card = document.querySelector('.card');

        function updateCard() {
            // Height belongs to the container. The card sizes itself to whatever box it
            // is given (that is how it behaves on a dashboard), so passing `height` as
            // config was always a no-op — there is no such option.
            card.style.height = parseInt($('height').value, 10) + 'px';

            // Dark mode is signalled by an attribute on the element; the stylesheet keys
            // its :host([dark]) rules off it. On a dashboard Home Assistant sets this.
            meteogram.toggleAttribute('dark', $('darkMode').checked);

            meteogram.setConfig({
                latitude: parseFloat($('latitude').value),
                longitude: parseFloat($('longitude').value),
                title: $('title').value,
                display_mode: $('displayMode').value,
                meteogram_hours: $('hours').value,
                show_wind: $('showWind').checked,
                show_sun: $('showSun').checked,
                show_pressure: $('showPressure').checked,
                show_precipitation: $('showPrecipitation').checked,
                show_cloud_cover: $('showCloudCover').checked,
                show_weather_icons: $('showWeatherIcons').checked,
                debug: $('debug').checked
            });
        }

        // Initial setup
        updateCard();

        // Update when button is clicked
        updateBtn.addEventListener('click', updateCard);
    });
</script>
</body>
</html>
