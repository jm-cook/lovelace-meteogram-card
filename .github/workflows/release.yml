name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 20 is the floor for vitest and eslint; 22 matches what is used locally.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Check the version rather than overwrite it. This step used to be
      # `npm version $VERSION --no-git-tag-version`, which silently accepted whatever
      # tag was typed and left package.json in the repo permanently out of date — it
      # sat at 3.2.1-beta for three release cycles. It also meant a mistyped tag built
      # cleanly: v2028.8.1-beta2 produced a perfectly good artefact two years in the
      # future, which would have shadowed every real release from then on.
      #
      # package.json is now the source of truth. Bump it, commit, then tag.
      - name: Version must match the tag
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          # The tag must be the package version, optionally with a prerelease suffix:
          # package.json 2026.8.1 accepts v2026.8.1, v2026.8.1-beta3 and v2026.8.1-rc1,
          # so a beta can be cut without a commit each time. It still rejects a
          # different version, which is the case that matters — a mistyped v2028.8.1
          # would have shipped an artefact two years ahead that shadowed every real
          # release after it.
          case "$TAG" in
            "$PKG"|"$PKG"-*) echo "tag $TAG matches package.json $PKG" ;;
            *)
              echo "::error::package.json says '$PKG' but the tag is '$TAG'."
              echo "The tag must be '$PKG', or '$PKG' with a prerelease suffix such as '$PKG-beta1'."
              echo "If the version itself is changing, bump package.json, commit, then re-cut the tag."
              exit 1
              ;;
          esac

      - name: Test
        run: npm test

      - name: Build
        # The tag, so the card reports the build it came from rather than the version it
        # shares with every prerelease of itself. Someone asked to confirm they have the
        # new build can only do that if the card distinguishes them.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/meteogram-card.js
          tag_name: ${{ github.ref_name }}
